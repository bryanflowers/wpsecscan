<!doctype html>
<html><head><meta charset="utf-8">
<title>WPSecScan overlay</title>
<style>
  body { font: 13px -apple-system, "Segoe UI", sans-serif; width: 300px; margin: 12px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  button { padding: 6px 10px; font-size: 12px; }
  #status { margin-top: 8px; color: #2c3e50; min-height: 20px; }
  #host   { font-family: ui-monospace, Consolas, monospace; color: #555; }
  label   { display: block; margin: 6px 0 3px; }
</style></head>
<body>
<h1>WPSecScan wp-admin overlay</h1>
<div id="host">(loading host…)</div>
<label>Load a report JSON for this host:</label>
<input type="file" id="file" accept=".json">
<div id="status"></div>
<p>Generate the JSON with:<br><code>wpsecscan https://your-site --json-only</code></p>
<script src="popup.js"></script>
</body></html>
