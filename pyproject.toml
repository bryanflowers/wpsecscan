[build-system]
# T4 (v2.8.0) — upper bounds on build-system deps per the v2.7.3
# Agent F F6 finding. A compromised `setuptools>=N` major release on
# PyPI would run arbitrary code at build time in every `pip install`
# from source; pinning bounds the supply-chain blast radius.
requires = ["setuptools>=68,<82", "wheel<1"]
build-backend = "setuptools.build_meta"

[project]
name = "wpsecscan"
version = "2.9.1"
description = "Defensive WordPress security scanner. 294 checks, CVE feed aggregated nightly from up to 8 public sources, AI-assisted remediation (BYO key), check-level compliance mappings for 12 frameworks, Sigstore-signed releases with GitHub build-provenance attestations, 9 report formats plus 14 exports, a sites registry, batch scans, a --daemon scheduler, and a token-protected --api-server with a target allowlist. Authorized testing only."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Bryan", email = "bryaninbangkok@gmail.com" },
]
keywords = [
    "wordpress", "security", "scanner", "pentest", "defensive",
    "vulnerability", "cve", "wpscan",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx[http2]>=0.27,<0.29",
    "jinja2>=3.1,<4",
    "rich>=13.7,<14",
    "openpyxl>=3.1,<4",
    # Q8: keyring is needed by the `wpsecscan creds` default-CLI surface
    # (post-v2.5.0). Previously in [ui] extra; default install silently
    # fell back to plain JSON. creds_vault still gracefully handles the
    # missing-keyring case so headless installs without a backend keep
    # working (the FailBackend check in creds_vault._have_keyring).
    # C26 (v2.7.2) — upper bound on keyring; v25+ tends to break the
    # backend-detection API. Without an upper bound `pip install` will
    # pull majors that change behaviour silently.
    "keyring>=24,<26",
    # `--config x.toml` reads TOML via tomllib (3.11+); 3.10 falls back to tomli.
    'tomli>=2,<3; python_version < "3.11"',
]

[project.optional-dependencies]
# C26 (v2.7.2) — every optional dep now has an upper-bound. Without one
# `pip install 'wpsecscan[ui]'` would silently pull the next major of
# Pillow / reportlab / etc., any of which can introduce a breaking
# change OR (in Pillow's case) a fresh CVE. Bumps are still possible
# but become a deliberate code review.
# Real PDF executive / attestation reports
pdf = ["reportlab>=4.0,<5"]
# Headless DOM-XSS check + per-finding screenshots
browser = ["playwright>=1.40,<2"]
# Daemon mode YAML config
yaml = ["pyyaml>=6.0,<7"]
# Distributed CVE-DB cache (redis). bcrypt is declared here but no module imports it.
ops = ["redis>=5.0,<7", "bcrypt>=4.0,<5"]
# Optional Pillow for GUI image rendering + pystray for minimize-to-tray (#56).
# (keyring moved to default `dependencies` in v2.5.1 because the `wpsecscan
# creds` CLI surface is no longer GUI-only.)
ui = ["Pillow>=10,<12", "pystray>=0.19,<0.20"]
# S5 — defusedxml protects the burp/zap importer against billion-laughs
# entity-expansion DoS on hostile XML reports. Stdlib ElementTree falls
# back with a stderr warning when this isn't installed.
security = ["defusedxml>=0.7,<0.8"]
# T4 (v2.8.0) — explicit extras for the optional integrations whose
# imports were undeclared in pyproject (per v2.7.1 audit F-prep).
# `pip install 'wpsecscan[aws]'` etc. now installs the right deps.
# Lazy-import sites in integrations_v27 / mobile_v27 / edu_v27 keep
# wpsecscan importable without these.
aws = ["boto3>=1.34,<2"]                  # integrations_v27.push_aws_sechub
tts = ["gTTS>=2.5,<3", "pyttsx3>=2.90,<3"]  # edu_v27.cmd_audio_summary
push = ["pywebpush>=2.0,<3"]              # mobile_v27.web_push_send
# Everything optional in one install
all = [
    "reportlab>=4.0,<5",
    "playwright>=1.40,<2",
    "pyyaml>=6.0,<7",
    "redis>=5.0,<7",
    "bcrypt>=4.0,<5",
    "Pillow>=10,<12",
    "pystray>=0.19,<0.20",
    "keyring>=24,<26",
    "defusedxml>=0.7,<0.8",
    # T4 (v2.8.0)
    "boto3>=1.34,<2",
    "gTTS>=2.5,<3",
    "pyttsx3>=2.90,<3",
    "pywebpush>=2.0,<3",
]
# Test deps (also installed by CI). T4 (v2.8.0) — upper bound added
# per the v2.7.3 Agent F F5 finding (pre-fix `>=7.4` could pull a
# breaking major into CI).
test = ["pytest>=7.4,<9"]

[project.scripts]
wpsecscan = "wpsecscan.__main__:main"
# U12 (v2.8.0) — short alias. Daily power-users typed `wpsecscan` 50+
# times per day; `wpsec` is a 4-keystroke save.
wpsec = "wpsecscan.__main__:main"

[project.gui-scripts]
wpsecscan-gui = "wpsecscan.gui:main"

[project.urls]
Homepage      = "https://github.com/bryanflowers/wpsecscan"
Repository    = "https://github.com/bryanflowers/wpsecscan"
Documentation = "https://github.com/bryanflowers/wpsecscan#readme"
Issues        = "https://github.com/bryanflowers/wpsecscan/issues"
Changelog     = "https://github.com/bryanflowers/wpsecscan/blob/main/CHANGELOG.md"
Security      = "https://github.com/bryanflowers/wpsecscan/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
include = ["wpsecscan*"]
exclude = ["tests*", "build*", "dist*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
wpsecscan = ["data/*.json", "data/*.j2", "data/*.txt"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: spawns subprocesses / >10s"]
filterwarnings = [
    "ignore::DeprecationWarning:ssl",
    "ignore::DeprecationWarning:wpsecscan.checks.tls_protocol_audit",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist", "wpsecscan.egg-info"]

[tool.ruff.lint]
# Gating set: undefined names, redefinitions, loop-var closures, syntax errors
# (E9/F6/F7/F8/F823/F811/F402/B023), plus the style rules cleaned and held
# clean by the v2.9.1 sweep (I import-sort, E401, F541, UP037). Not gated:
# F401 (the package re-exports through __init__.py) and E701/E702 (left as-is).
select = ["E9", "F63", "F7", "F82", "F823", "F811", "F402", "B023",
          "I", "E401", "F541", "UP037"]
