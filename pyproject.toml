[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wpsecscan"
version = "1.6.0"
description = "Defensive WordPress security scanner — 120 checks, threat-intel integrations, YAML templates, GUI + CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Bryan", email = "bryaninbangkok@gmail.com" },
]
keywords = [
    "wordpress", "security", "scanner", "pentest", "defensive",
    "vulnerability", "cve", "wpscan",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx[http2]>=0.27,<0.29",
    "jinja2>=3.1,<4",
    "rich>=13.7,<14",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
# Real PDF executive / attestation reports
pdf = ["reportlab>=4.0"]
# Headless DOM-XSS check + per-finding screenshots
browser = ["playwright>=1.40"]
# Daemon mode YAML config
yaml = ["pyyaml>=6.0"]
# Distributed CVE-DB cache + RBAC bcrypt hashing
ops = ["redis>=5.0", "bcrypt>=4.0"]
# OpenTelemetry traces
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
# Everything optional in one install
all = [
    "reportlab>=4.0",
    "playwright>=1.40",
    "pyyaml>=6.0",
    "redis>=5.0",
    "bcrypt>=4.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
# Test deps (also installed by CI)
test = ["pytest>=7.4"]

[project.scripts]
wpsecscan = "wpsecscan.__main__:main"

[project.gui-scripts]
wpsecscan-gui = "wpsecscan.gui:main"

[project.urls]
Homepage      = "https://github.com/bryanflowers/wpsecscan"
Repository    = "https://github.com/bryanflowers/wpsecscan"
Documentation = "https://github.com/bryanflowers/wpsecscan#readme"
Issues        = "https://github.com/bryanflowers/wpsecscan/issues"
Changelog     = "https://github.com/bryanflowers/wpsecscan/blob/main/CHANGELOG.md"
Security      = "https://github.com/bryanflowers/wpsecscan/blob/main/SECURITY.md"

[tool.setuptools]
packages = ["wpsecscan", "wpsecscan.checks", "wpsecscan.reporters", "wpsecscan.integrations"]
include-package-data = true

[tool.setuptools.package-data]
wpsecscan = ["data/*.json", "data/*.j2", "data/*.txt"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:ssl",
    "ignore::DeprecationWarning:wpsecscan.checks.tls_protocol_audit",
]
