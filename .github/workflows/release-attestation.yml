name: Release attestation (SLSA + Sigstore + SBOM)

# Round-64 Group D (#32, #34, #35) — generates SLSA build provenance,
# Sigstore signatures, and CycloneDX SBOM for every release.
# Triggers on tag push (v*.*.*) automatically.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to attest (defaults to latest release)
        required: false

permissions:
  contents: write   # to attach attestations to the release
  id-token: write   # required for Sigstore keyless signing
  attestations: write  # required for SLSA provenance

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      # C27 (v2.7.2) — SHA-pin every action; this workflow holds
      # id-token: write + contents: write + attestations: write so
      # the blast radius of a tag-poisoned action would be release-
      # publishing rights. Update via Dependabot.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || 'main' }}

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir artifacts
          # C23 (v2.7.2) — also attest the sdist (.tar.gz) and wheel
          # (.whl) so the PyPI-published artifacts get SLSA provenance,
          # not just the .exe binaries.
          gh release download "$TAG" --dir artifacts/ \
            --pattern "*.exe" --pattern "*.zip" \
            --pattern "*.tar.gz" --pattern "*.whl" || true
          ls -la artifacts/

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          # C23 — include sdist + wheel in the checksum file too.
          sha256sum *.exe *.zip *.tar.gz *.whl > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          # C23 — attestation subject covers PyPI artifacts too.
          subject-path: 'artifacts/*.exe,artifacts/*.zip,artifacts/*.tar.gz,artifacts/*.whl'

      - name: Install cosign for Sigstore signing
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign artifacts with Sigstore (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cd artifacts
          # C23 — sign sdist + wheel too.
          for f in *.exe *.zip *.tar.gz *.whl; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes "$f" --output-signature "$f.sig" --output-certificate "$f.pem"
          done

      - name: Generate CycloneDX SBOM
        run: |
          # C25 (v2.7.2) — pin cyclonedx-bom to a known version. An
          # unpinned package install in this job (which holds id-token:
          # write + contents: write) would let a compromised PyPI
          # release of cyclonedx-bom run arbitrary code with release
          # publishing rights.
          pip install --quiet 'cyclonedx-bom==4.4.3'
          cyclonedx-py environment -o artifacts/sbom.cyclonedx.json || \
            cyclonedx-py requirements -i requirements.txt -o artifacts/sbom.cyclonedx.json

      - name: Re-attach signed artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          cd artifacts
          gh release upload "$TAG" SHA256SUMS.txt \
            *.sig *.pem sbom.cyclonedx.json --clobber

      - name: Job summary
        if: always()
        run: |
          echo "## Release attestation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ SLSA build provenance attestation generated" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Sigstore keyless signatures (.sig + .pem per artifact)" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ CycloneDX SBOM attached" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ SHA256SUMS.txt attached" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Users can verify with:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "cosign verify-blob wpsecscan.exe \\" >> $GITHUB_STEP_SUMMARY
          echo "  --signature wpsecscan.exe.sig --certificate wpsecscan.exe.pem \\" >> $GITHUB_STEP_SUMMARY
          # C24 (v2.7.2) — identity regexp pinned to the release-
          # attestation workflow path so a compromise of any other
          # workflow in this repo can't produce a valid cert that
          # users would mistake for a release-attestation signature.
          echo "  --certificate-identity-regexp 'https://github.com/bryanflowers/wpsecscan/\\.github/workflows/release-attestation\\.yml@refs/tags/.*' \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
