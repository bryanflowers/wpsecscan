# v2.8.4 Phase 7 — CodeQL SAST.
# Closes the OpenSSF Scorecard "SAST: 0" gap. Runs CodeQL's default
# Python query suite weekly + on PRs to main. Pin every action to a
# full commit SHA (Scorecard Pinned-Dependencies).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Sunday 03:17 UTC
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - name: Checkout
        # actions/checkout v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Initialize CodeQL
        # github/codeql-action/init v3.27.5
        uses: github/codeql-action/init@aa578102511db1f4524ed59b8cc2bae4f6e88195
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        # github/codeql-action/analyze v3.27.5
        uses: github/codeql-action/analyze@aa578102511db1f4524ed59b8cc2bae4f6e88195
        with:
          category: "/language:${{ matrix.language }}"
