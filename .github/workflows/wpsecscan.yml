name: WPSecScan

# Drop this in `.github/workflows/wpsecscan.yml` of any repo to auto-scan a
# WordPress URL on every PR + nightly. The scan posts a comment on the PR
# with the risk score delta vs main.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to scan"
        required: true
        default: "https://your-wp-site.com"
  schedule:
    # Nightly at 03:30 UTC
    - cron: "30 3 * * *"
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # Skip on PRs (incl. Dependabot) when no real target is configured —
    # otherwise the scan runs against the placeholder host and always fails.
    if: github.event_name != 'pull_request' || vars.WPSEC_TARGET != ''
    env:
      WPSEC_TARGET: ${{ github.event.inputs.target_url || vars.WPSEC_TARGET || 'https://your-wp-site.com' }}
    steps:
      # N16 (v2.7.3) — SHA-pin actions; Dependabot's github-actions
      # config keeps these current.
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install wpsecscan from PyPI
        # N18 (v2.7.3) — was: `git clone --depth 1` of main + `pip install
        # -e .`, with no ref pin. Any push to main between the workflow
        # trigger and the clone changed what got installed silently. Now
        # we install the published PyPI release at a known version. End
        # users who want to track a branch should pin a specific commit
        # SHA here.
        run: |
          # v2.8.3 — bumped from 2.7.3 (4 minors stale) to >=2.8.3,<3
          # so users of this template auto-track the latest 2.x release.
          # Pin a specific version (e.g. ==2.8.3) for reproducible CI.
          pip install --quiet 'wpsecscan>=2.8.3,<3'

      - name: Run scan
        # N18 (v2.7.3) — was: `${{ secrets.WPSCAN_TOKEN && format(... ) || '' }}`
        # expanded inline in the shell command. If WPSCAN_TOKEN contained
        # shell metacharacters ($, ;, backtick) it became a shell-
        # injection vector. Now: pass via env: block and reference the
        # env var with bash variable expansion (safe under `set -u`).
        env:
          WPSCAN_TOKEN_VAL: ${{ secrets.WPSCAN_TOKEN }}
          PATCHSTACK_TOKEN_VAL: ${{ secrets.PATCHSTACK_TOKEN }}
        run: |
          extra=()
          if [ -n "${WPSCAN_TOKEN_VAL:-}" ]; then
            extra+=(--wpscan-token "${WPSCAN_TOKEN_VAL}")
          fi
          if [ -n "${PATCHSTACK_TOKEN_VAL:-}" ]; then
            extra+=(--patchstack-token "${PATCHSTACK_TOKEN_VAL}")
          fi
          python -m wpsecscan "${WPSEC_TARGET}" \
            --json-only --no-color \
            --out ./reports \
            --fail-on critical \
            "${extra[@]}"
        continue-on-error: true

      - name: Upload report artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: wpsecscan-report
          path: reports/

      - name: Comment on PR with risk score
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const files = fs.readdirSync('reports').filter(f => f.endsWith('.json'));
            if (!files.length) return;
            const data = JSON.parse(fs.readFileSync(path.join('reports', files[0]), 'utf-8'));
            const s = data.summary || {};
            const body = `## 🔍 WPSecScan results for \`${data.target}\`\n\n` +
              `**Risk score**: ${data.risk_score}/100 (grade ${data.risk_grade})\n\n` +
              `- 🔴 Critical: ${s.critical || 0}\n` +
              `- 🟠 High: ${s.high || 0}\n` +
              `- 🟡 Medium: ${s.medium || 0}\n` +
              `- 🔵 Low: ${s.low || 0}\n` +
              `- ⚪ Info: ${s.info || 0}\n\n` +
              `Full report in the **wpsecscan-report** artifact.`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
