name: OSSF Scorecard

# Round-64 Group D (#36) — OpenSSF Scorecard runs supply-chain security
# checks (signed releases, branch protection, dependency update tools,
# fuzzing, CII Best Practices, etc.) and publishes the score to a
# public dashboard. Aim: ≥7.0/10.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      # N16 (v2.7.3) — SHA-pin every action; this workflow has
      # id-token: write so a tag-poisoned action would have
      # release-signing privileges. Dependabot's github-actions
      # config keeps these current.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with: { persist-credentials: false }

      - uses: ossf/scorecard-action@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: SARIF
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@dc73d59c2d7bd4f8194098a91219eeee6d8a1719  # v4
        with:
          sarif_file: results.sarif
