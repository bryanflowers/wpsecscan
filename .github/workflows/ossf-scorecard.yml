name: OSSF Scorecard

# Round-64 Group D (#36) — OpenSSF Scorecard runs supply-chain security
# checks (signed releases, branch protection, dependency update tools,
# fuzzing, CII Best Practices, etc.) and publishes the score to a
# public dashboard. Aim: ≥7.0/10.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }

      - uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@v5
        with:
          name: SARIF
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
