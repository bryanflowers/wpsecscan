name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # v2.8.2 — extend matrix to 3.13. 3.14 still pre-release, defer.
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install deps
        # N17 (v2.7.3) — version-pin every direct dep so a compromised
        # PyPI release of pytest/pyyaml can't ride into CI. Hash-pinning
        # is the strongest mitigation but requires a maintained
        # requirements.lock; version-pinning is the high-value
        # incremental step. Bump these here when you bump them in
        # pyproject.toml's `test` extra.
        run: |
          python -m pip install --upgrade pip==25.3
          pip install .
          pip install 'pytest==8.3.4' 'pyyaml==6.0.2'

      - name: Run pytest
        env:
          # Disable the live dashboard for CI logs
          WPSECSCAN_NO_LIVE: "1"
        run: pytest -q --color=yes

  lint:
    name: pyflakes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install 'pyflakes==3.2.0'
          pyflakes wpsecscan tests || true
        # `|| true` so style nits don't block PRs; remove to make lint a gate

  build-exes:
    name: PyInstaller (smoke build)
    runs-on: windows-latest
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install deps + PyInstaller
        # N17 (v2.7.3) — `build-exes` produces the .exe distributed
        # to users. PyInstaller MUST be version-pinned so a
        # compromised release can't backdoor every binary we ship.
        run: |
          python -m pip install --upgrade pip==25.3
          pip install . 'pyinstaller==6.13.0'
      - name: Build CLI .exe
        run: |
          python -m PyInstaller --noconfirm --onefile --name wpsecscan `
            --add-data "wpsecscan\data;wpsecscan\data" `
            --add-data "scripts\add-defender-exclusion.ps1;scripts" `
            --collect-submodules wpsecscan `
            --collect-submodules openpyxl `
            --version-file version_info.txt `
            run.py
      - name: Build GUI .exe
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name wpsecscan-gui `
            --add-data "wpsecscan\data;wpsecscan\data" `
            --add-data "scripts\add-defender-exclusion.ps1;scripts" `
            --collect-submodules wpsecscan `
            --collect-submodules openpyxl `
            --version-file version_info.txt `
            run_gui.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: wpsecscan-binaries-${{ github.sha }}
          path: |
            dist/wpsecscan.exe
            dist/wpsecscan-gui.exe
          retention-days: 14
