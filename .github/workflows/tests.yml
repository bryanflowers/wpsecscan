name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml

      - name: Run pytest
        env:
          # Disable the live dashboard for CI logs
          WPSECSCAN_NO_LIVE: "1"
        run: pytest -q --color=yes

  lint:
    name: pyflakes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install pyflakes
          pyflakes wpsecscan tests || true
        # `|| true` so style nits don't block PRs; remove to make lint a gate

  build-exes:
    name: PyInstaller (smoke build)
    runs-on: windows-latest
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build CLI .exe
        run: |
          python -m PyInstaller --noconfirm --onefile --name wpsecscan `
            --add-data "wpsecscan\data;wpsecscan\data" `
            --add-data "scripts\add-defender-exclusion.ps1;scripts" `
            --collect-submodules wpsecscan `
            --collect-submodules openpyxl `
            --version-file version_info.txt `
            run.py
      - name: Build GUI .exe
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name wpsecscan-gui `
            --add-data "wpsecscan\data;wpsecscan\data" `
            --add-data "scripts\add-defender-exclusion.ps1;scripts" `
            --collect-submodules wpsecscan `
            --collect-submodules openpyxl `
            --version-file version_info.txt `
            run_gui.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wpsecscan-binaries-${{ github.sha }}
          path: |
            dist/wpsecscan.exe
            dist/wpsecscan-gui.exe
          retention-days: 14
