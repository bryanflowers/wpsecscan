name: pypi-publish

# Item #66 — Publish to PyPI (and TestPyPI for dry runs).
#
# Two trigger modes:
#   1. workflow_dispatch with environment=testpypi   → TestPyPI (token-auth)
#   2. workflow_dispatch with environment=pypi      → real PyPI (token-auth)
#
# Both indexes use API-token auth. Tokens stored as repo secrets:
#   TEST_PYPI_API_TOKEN  (issued at https://test.pypi.org/manage/account/token/)
#   PYPI_API_TOKEN       (issued at https://pypi.org/manage/account/token/)
# Mirrored for rotation reference in C:\Users\bryan\migration\HANDOFF.md.
# See docs/release-pypi.md for the runbook.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target index"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read   # token-auth path doesn't need id-token: write

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip build twine
      - name: Build
        run: python -m build
      - name: Validate
        run: |
          twine check dist/*
          ls -l dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wpsecscan-dist-${{ github.sha }}
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI (dry run)
    if: github.event.inputs.environment == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/wpsecscan/
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wpsecscan-dist-${{ github.sha }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI (real)
    if: github.event.inputs.environment == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wpsecscan/
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wpsecscan-dist-${{ github.sha }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Default endpoint is https://upload.pypi.org/legacy/ — leave unset.
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
