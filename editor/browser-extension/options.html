<!doctype html>
<html><head><meta charset="utf-8"><title>WPSecScan options</title>
<style>body{font-family:system-ui;padding:1.5em;max-width:480px}label{display:block;margin:1em 0}input{padding:.3em;width:100%}</style>
</head><body>
<h1>WPSecScan launcher</h1>
<label>Local WPSecScan API URL:
<input id="api" placeholder="http://localhost:8765">
</label>
<button id="save">Save</button>
<p id="status"></p>
<script>
chrome.storage.sync.get(["apiUrl"]).then(d => {
  document.getElementById("api").value = d.apiUrl || "http://localhost:8765";
});
document.getElementById("save").onclick = async () => {
  await chrome.storage.sync.set({ apiUrl: document.getElementById("api").value.trim() });
  document.getElementById("status").textContent = "Saved.";
};
</script>
</body></html>
