# Azure DevOps pipeline for WPSecScan
trigger:
  branches:
    include: [main]

schedules:
  - cron: "30 3 * * *"
    displayName: Nightly WPSecScan
    branches:
      include: [main]
    always: true

# WPSEC_TARGET is REQUIRED: define it as a pipeline variable (a site you own or
# are authorised to test). There is deliberately no default.

pool:
  vmImage: ubuntu-latest

steps:
  - bash: |
      if [ -z "$WPSEC_TARGET" ]; then
        echo "WPSEC_TARGET is not set - define it as a pipeline variable" >&2
        exit 1
      fi
    displayName: Require target

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.11"

  - bash: |
      pip install --quiet httpx[http2] jinja2 rich openpyxl
      git clone --depth 1 https://github.com/bryanflowers/wpsecscan.git _wpsecscan
      pip install --quiet -e ./_wpsecscan
    displayName: Install WPSecScan

  - bash: |
      python -m wpsecscan "$WPSEC_TARGET" \
        --json-only --no-color \
        --out ./reports \
        --fail-on critical \
        ${WPSCAN_TOKEN:+--wpscan-token "$WPSCAN_TOKEN"} \
        ${PATCHSTACK_TOKEN:+--patchstack-token "$PATCHSTACK_TOKEN"}
    displayName: Run scan
    env:
      WPSCAN_TOKEN: $(WPSCAN_TOKEN)
      PATCHSTACK_TOKEN: $(PATCHSTACK_TOKEN)

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      pathToPublish: reports
      artifactName: wpsecscan-report
